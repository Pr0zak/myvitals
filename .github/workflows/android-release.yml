name: android release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

# Opt every JavaScript-based action into Node 24 ahead of GitHub's
# 2026-06-02 forced cutover. Surfaces compatibility breakage now
# instead of on the deadline. Removable once each action publishes
# a release pinned to Node 24 by default.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # SA-G1: gate the signed release on the test suite for the same reason
  # images.yml does — a red backend/android suite should not produce an
  # artifact GitHub Releases hands to the update checker. See tests.yml.
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Compute version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "BUILD_VERSION_NAME=$VERSION" >> $GITHUB_ENV
          echo "BUILD_VERSION_CODE=$GITHUB_RUN_NUMBER" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # The action's default `packages` is "tools platform-tools", and
          # the deprecated `tools` package was removed from the SDK, so the
          # default install now fails outright:
          #   Warning: Failed to find package 'tools'
          #   Error: sdkmanager failed with exit code 1
          # It broke every Android job on 2026-09-17, including the v0.39.0
          # release. The runner image already ships platform-tools and the
          # build-tools the Gradle build asks for, so the right fix is to
          # install nothing extra rather than to name a replacement.
          packages: ''

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 secret is missing — see docs/releasing.md"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/android/release.jks"

      - name: Write keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          cat > keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/android/release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build release APK
        working-directory: android
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew :app:assembleRelease --no-daemon
          else
            gradle :app:assembleRelease --no-daemon
          fi

      - name: Verify APK is signed
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n1)
          # Glob can match multiple build-tools versions; pick the highest.
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -n1)
          echo "Found APK:       $APK"
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Stage release artifacts
        id: stage
        run: |
          mkdir -p release
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n1)
          OUT="release/myvitals-${{ steps.ver.outputs.version }}.apk"
          cp "$APK" "$OUT"
          (cd release && sha256sum "$(basename "$OUT")" > "$(basename "$OUT").sha256")
          echo "apk=$OUT" >> $GITHUB_OUTPUT

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          files: |
            release/*.apk
            release/*.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
